<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="970" viewBox="0 0 1650 970"><rect width="100%" height="100%" fill="white"/><text x="825" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle" fill="#17252e">Esquema implementado en lat_ot_ap4</text><rect x="60" y="110" width="1530" height="572" rx="5" fill="white" stroke="#243746" stroke-width="3"/><text x="78" y="155" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#17252e">orden_trabajo</text><line x1="60" y1="172" x2="1590" y2="172" stroke="#243746" stroke-width="3"/><text x="78" y="210" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="400" text-anchor="start" fill="#17252e">PK id INT NOT NULL AUTO_INCREMENT</text><text x="78" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="400" text-anchor="start" fill="#17252e">linea VARCHAR(100) NOT NULL</text><text x="78" y="334" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="400" text-anchor="start" fill="#17252e">piquete VARCHAR(30) NOT NULL</text><text x="78" y="396" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="400" text-anchor="start" fill="#17252e">descripcion VARCHAR(500) NOT NULL</text><text x="78" y="458" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="400" text-anchor="start" fill="#17252e">tipo ENUM(&#x27;PREVENTIVA&#x27;,&#x27;CORRECTIVA&#x27;) NOT NULL</text><text x="78" y="520" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="400" text-anchor="start" fill="#17252e">estado ENUM(&#x27;PENDIENTE&#x27;,&#x27;EN_PROCESO&#x27;,&#x27;FINALIZADA&#x27;) NOT NULL</text><text x="78" y="582" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="400" text-anchor="start" fill="#17252e">DEFAULT de estado: &#x27;PENDIENTE&#x27;</text><text x="78" y="644" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="400" text-anchor="start" fill="#17252e">creada_en TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP</text><text x="65" y="780" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="400" text-anchor="start" fill="#17252e">Índice no único: idx_linea_piquete(linea, piquete).</text><text x="65" y="838" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="400" text-anchor="start" fill="#17252e">CHECK: línea, piquete y descripción no vacíos tras TRIM.</text><text x="65" y="896" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#17252e">Una entidad; sin claves foráneas ni relaciones entre tablas en este incremento.</text></svg>